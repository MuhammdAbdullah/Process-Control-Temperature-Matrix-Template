<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <link rel="stylesheet" href="assets/css/matrix-ui.css">

    <style>
        html, body { height: 100%; overflow: hidden; -webkit-app-region: no-drag; }
        .chart-wrap { position: relative; width: 100%; flex: 1; min-height: 0; }
        .chart-wrap canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
    </style>
</head>
<body class="min-h-screen bg-base-100 flex flex-col overflow-hidden p-2 gap-2">

    <!-- Minimal header -->
    <div class="navbar bg-base-200 rounded-box shadow px-4 flex-shrink-0 min-h-[44px]">
        <span class="font-semibold text-sm flex-1">📈 Data</span>
    </div>

    <!-- Chart card -->
    <div class="card bg-base-200 shadow flex-1 min-h-0">
        <div class="card-body p-3 flex flex-col gap-2">
            <div class="chart-wrap flex-1">
                <canvas id="testChartPage"></canvas>
            </div>
            <p class="text-xs opacity-50 text-center flex-shrink-0">
                Live temperature and power data from main application
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="chart-page.js"></script>
</body>
</html>
