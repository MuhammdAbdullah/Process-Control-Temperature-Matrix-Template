<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Control Temperature App - Loading</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <link rel="stylesheet" href="assets/css/matrix-ui.css">

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.8s ease-out both; }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 16px rgba(0,0,0,0.12)); }
            50%       { transform: scale(1.06); filter: drop-shadow(0 6px 24px rgba(0,0,0,0.18)); }
        }
        .logo-pulse { animation: logoPulse 2.4s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen bg-base-100 flex items-center justify-center overflow-hidden">

    <div class="fade-in-up flex flex-row items-center gap-12 px-16 max-w-3xl">

        <!-- Logo -->
        <div class="flex-shrink-0">
            <img src="assets/logo.png"
                 alt="Process Control Temperature App Logo"
                 class="logo-pulse w-48 h-48 object-contain">
        </div>

        <!-- Content -->
        <div class="flex flex-col items-center gap-5 flex-1">
            <h1 class="text-3xl font-bold text-center leading-tight">
                Process Control Temperature App
            </h1>

            <div class="flex flex-col items-center gap-3">
                <span class="loading loading-spinner loading-lg text-primary"></span>
                <p id="loadingText" class="text-sm opacity-70 animate-pulse">
                    Initializing application...
                </p>
                <progress id="splashProgress"
                          class="progress progress-primary w-56"
                          value="0" max="100"></progress>
            </div>
        </div>
    </div>

    <!-- Bottom branding -->
    <div class="absolute bottom-4 left-4 text-xs opacity-40">Matrix Technology Solutions</div>
    <div class="absolute bottom-4 right-4 text-xs opacity-40 font-mono">v1.1.0</div>

    <script>
        const loadingTexts = [
            'Initializing application...',
            'Loading interface...',
            'Connecting to device...',
            'Preparing controls...',
            'Almost ready...'
        ];

        let currentTextIndex = 0;
        const loadingTextEl = document.getElementById('loadingText');
        const progressEl    = document.getElementById('splashProgress');

        function updateLoadingText() {
            if (currentTextIndex < loadingTexts.length) {
                loadingTextEl.textContent = loadingTexts[currentTextIndex];
                currentTextIndex++;
                setTimeout(updateLoadingText, 400);
            }
        }

        // Animate progress bar 0 → 100 over ~2 s
        let progressValue = 0;
        const progressInterval = setInterval(() => {
            progressValue = Math.min(progressValue + 2, 100);
            progressEl.value = progressValue;
            if (progressValue >= 100) clearInterval(progressInterval);
        }, 40);

        setTimeout(updateLoadingText, 500);

        document.addEventListener('DOMContentLoaded', function () {
            const logo = document.querySelector('.logo-pulse');
            logo.addEventListener('mouseenter', () => {
                logo.style.transform = 'scale(1.1)';
                logo.style.transition = 'transform 0.3s ease';
            });
            logo.addEventListener('mouseleave', () => {
                logo.style.transform = '';
            });
        });
    </script>
</body>
</html>
